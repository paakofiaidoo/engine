syntax = "proto3";

package engine.v1;

option go_package = "juki-engine/gen/engine/v1;enginev1";

service EngineService {
  rpc Ping(PingRequest) returns (PingResponse);

  // Project Service
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc SyncProject(SyncProjectRequest) returns (SyncProjectResponse);

  // Page Service
  rpc CreatePage(CreatePageRequest) returns (CreatePageResponse);
  rpc GetPage(GetPageRequest) returns (GetPageResponse);
  rpc SavePage(SavePageRequest) returns (SavePageResponse);

  // Build Service
  rpc BuildProject(BuildProjectRequest) returns (BuildProjectResponse);

  // Plugin & CMS Service
  rpc InstallPlugin(InstallPluginRequest) returns (InstallPluginResponse);
  rpc ConfigureCMS(ConfigureCMSRequest) returns (ConfigureCMSResponse);

  // Swarm Service
  rpc RunSwarm(RunSwarmRequest) returns (stream SwarmEvent);

  // File Watcher Service
  rpc SubscribeToFileEvents(SubscribeToFileEventsRequest) returns (stream FileEvent);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

// Project Messages
message Project {
  string id = 1;
  string name = 2;
  string path = 3;
  string framework = 4;
  string description = 5;
  repeated Page pages = 6;
  string global_css = 7;
  string api_key = 8;
}

message CreateProjectRequest {
  string name = 1;
  string path = 2;
  string framework = 3;
  string description = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message UpdateProjectRequest {
  Project project = 1;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}

message SyncProjectRequest {
  string id = 1;
}

message SyncProjectResponse {
  Project project = 1;
}

// Page Messages
message Page {
  string id = 1;
  string name = 2;
  string route = 3;
  string content = 4; // JSON string
  string raw_content = 5; // Raw file content (e.g. TSX)
}

message CreatePageRequest {
  string project_id = 1;
  string name = 2;
  string route = 3;
}

message CreatePageResponse {
  Page page = 1;
}

message GetPageRequest {
  string id = 1;
}

message GetPageResponse {
  Page page = 1;
}

// Plugin Messages
message InstallPluginRequest {
  string project_id = 1;
  string plugin_name = 2; // e.g., "payload-cms"
  string version = 3;
}

message InstallPluginResponse {
  bool success = 1;
  string message = 2;
}

// CMS Messages
message ConfigureCMSRequest {
  string project_id = 1;
  string cms_type = 2; // e.g., "payload"
  string config_json = 3; // JSON string for configuration
}

message ConfigureCMSResponse {
  bool success = 1;
  string message = 2;
}

message SavePageRequest {
  string project_id = 1;
  string page_id = 2;
  string content = 3; // The JSX content to write to the file
}

message SavePageResponse {
  bool success = 1;
  string message = 2;
}

message BuildProjectRequest {
  string project_id = 1;
}

message BuildProjectResponse {
  bool success = 1;
  string output = 2;
}

// Swarm Service
message RunSwarmRequest {
  string project_id = 1;
  string prompt = 2;
}

message SwarmEvent {
  oneof event {
    SwarmPlan plan = 1;
    SwarmLog log = 2;
    SwarmResult result = 3;
  }
}

message SwarmPlan {
  repeated SwarmStep steps = 1;
}

message SwarmStep {
  string id = 1;
  string description = 2;
  string status = 3; // "pending", "running", "completed", "failed"
}

message SwarmLog {
  string step_id = 1;
  string message = 2;
  string level = 3; // "info", "warn", "error"
}

message SwarmResult {
  bool success = 1;
  string message = 2;
}

message SubscribeToFileEventsRequest {
  string project_id = 1;
}

message FileEvent {
  string path = 1;
  string type = 2; // "CREATE", "WRITE", "REMOVE", "RENAME"
}
